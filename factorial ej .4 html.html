<script>

let n , i = 1;
let fact = 1;

console.log("Ingrese un numero entero positivo (N): ");
n = Number(prompt("N:"));

while (n < 0) {
    console.log("Error: el factorial no existe para negativos. Ingrese otro valor: ");

    n = Number(prompt("N:"));
    
}

while (i <= n) {
    fact = fact * i;
    i = i + 1;
}

console.log("El factorial de " + n + " es: " + fact);
document.write("El factorial de " + n + " es: " + fact);
</script>
